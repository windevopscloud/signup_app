{% extends "base.html" %}
{% block body %}
<h1>Update e-mail</h1>
<p>Current: <strong>{{ user.email }}</strong></p>
<form method="post">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <label for="new_email">New e-mail</label><input id="new_email" name="new_email" type="email" autocomplete="email" required>
  <button>Send codes</button>
</form>
<div class="stack tight"><a class="btn secondary" href="{{ url_for('index') }}">Cancel</a></div>
{% endblock %}
