{% extends "base.html" %}
{% block body %}
<h1>Update e-mail</h1>
<p>Current: {{ user.email }}</p>
<form method="post">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <label for="new_email">New e-mail</label><input id="new_email" name="new_email" type="email" required>
  <button>Send codes</button>
</form>
<p><a href="{{ url_for('index') }}">Back</a></p>
{% endblock %}
