{% extends "base.html" %}
{% block body %}
<h1>Register</h1>
<p>We will e-mail you a code to confirm your address.</p>
<form method="post">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <label for="name">Name</label><input id="name" name="name" maxlength="80" autocomplete="name" required>
  <label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email" required>
  <button>Send me a 4-digit code</button>
</form>
<p class="links"><a href="{{ url_for('login') }}">Already registered? Log in</a></p>
{% endblock %}
