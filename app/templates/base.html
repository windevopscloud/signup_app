<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{% block title %}Join us{% endblock %}</title>
<script src="{{ url_for('static', filename='theme.js') }}"></script>
<style>
  :root{
    --bg1:#eef2ff; --bg2:#f8fafc; --card:#ffffff; --text:#1d2330; --muted:#5b6578;
    --line:#d9deea; --accent:#4f46e5; --accent-h:#4338ca; --accent-soft:#eef0ff;
    --err-bg:#fdecec; --err:#8a1c1c; --info-bg:#e8f1ff; --info:#1a3d7c;
    --shadow:0 10px 30px rgba(30,41,90,.10),0 2px 6px rgba(30,41,90,.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg1:#12142a; --bg2:#0d0f1c; --card:#1a1d33; --text:#e8eaf6; --muted:#9aa3bd;
      --line:#30344f; --accent:#7c83ff; --accent-h:#9aa0ff; --accent-soft:#252a52;
      --err-bg:#3a1d22; --err:#ffb4b4; --info-bg:#1d2b4d; --info:#b9d1ff;
      --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg1:#12142a; --bg2:#0d0f1c; --card:#1a1d33; --text:#e8eaf6; --muted:#9aa3bd;
    --line:#30344f; --accent:#7c83ff; --accent-h:#9aa0ff; --accent-soft:#252a52;
    --err-bg:#3a1d22; --err:#ffb4b4; --info-bg:#1d2b4d; --info:#b9d1ff;
    --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;
  }
  *{box-sizing:border-box}
  html{min-height:100%}
  body{
    margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5; color:var(--text);
    background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;
    padding:2rem 1rem;
  }
  .topbar{position:relative;width:100%;max-width:26rem;display:flex;justify-content:center;margin:1rem 0 1.5rem}
  .brand{display:flex;align-items:center;gap:.6rem;font-weight:700;font-size:1.15rem;letter-spacing:.2px}
  .toggle{position:absolute;right:0;top:50%;transform:translateY(-50%);width:2.4rem;height:2.4rem;margin:0;padding:0;
          display:grid;place-items:center;border-radius:50%;cursor:pointer;color:var(--text);background:var(--card);border:1px solid var(--line)}
  .toggle:hover{background:var(--accent-soft)}
  .toggle svg{width:1.15rem;height:1.15rem;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .toggle .sun{display:none}
  :root[data-theme="dark"] .toggle .sun{display:block}
  :root[data-theme="dark"] .toggle .moon{display:none}
  :root:not([data-theme]) .toggle{display:none}
  .brand a{color:inherit;text-decoration:none;display:flex;align-items:center;gap:.6rem}
  .logo{width:2.2rem;height:2.2rem;border-radius:.7rem;display:grid;place-items:center;color:#fff;font-weight:800;
        background:linear-gradient(135deg,#6366f1,#8b5cf6);box-shadow:0 4px 12px rgba(99,102,241,.45)}
  main{width:100%;max-width:26rem}
  .card{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:1.75rem;box-shadow:var(--shadow)}
  h1{font-size:1.45rem;line-height:1.25;margin:0 0 .5rem;overflow-wrap:anywhere}
  p{margin:.5rem 0;color:var(--muted)}
  strong{color:var(--text)}
  label{display:block;margin:1rem 0 .35rem;font-size:.9rem;font-weight:600}
  input{
    width:100%; padding:.7rem .8rem; font-size:1rem; font-family:inherit;
    color:var(--text); background:transparent; border:1px solid var(--line); border-radius:.6rem;
    transition:border-color .15s, box-shadow .15s;
  }
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  input[inputmode="numeric"]{text-align:center;font-size:1.5rem;letter-spacing:.6rem;font-variant-numeric:tabular-nums}
  button,.btn{
    display:inline-block; width:100%; margin-top:1.25rem; padding:.75rem 1rem; font-size:1rem; font-weight:600;
    font-family:inherit; text-align:center; text-decoration:none; cursor:pointer;
    color:#fff; background:var(--accent); border:0; border-radius:.6rem;
    transition:background .15s, transform .05s;
  }
  button:hover,.btn:hover{background:var(--accent-h)}
  button:active,.btn:active{transform:translateY(1px)}
  button:focus-visible,.btn:focus-visible,a:focus-visible{outline:3px solid var(--accent-soft);outline-offset:2px}
  .btn.secondary,button.secondary{color:var(--accent);background:transparent;border:1px solid var(--line)}
  .btn.secondary:hover,button.secondary:hover{background:var(--accent-soft)}
  a{color:var(--accent)}
  .msg{padding:.7rem .9rem;margin:0 0 1rem;border-radius:.6rem;font-size:.95rem}
  .msg.error{background:var(--err-bg);color:var(--err)}
  .msg.info{background:var(--info-bg);color:var(--info)}
  .stack{display:flex;flex-direction:column;gap:.6rem;margin-top:1.25rem}
  .stack .btn,.stack button{margin-top:0}
  .links{margin-top:1.25rem;font-size:.92rem;text-align:center;color:var(--muted)}
  .links a{margin:0 .35rem}
  nav a{margin-right:1rem}
  form.inline{display:inline}
  .hello{display:flex;align-items:flex-start;gap:.9rem}
  .avatar{flex:none;width:3rem;height:3rem;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:1.2rem;
          background:linear-gradient(135deg,#6366f1,#8b5cf6)}
  .hello h1{margin:0;font-size:1.2rem;min-width:0;flex:1;overflow-wrap:anywhere}
  .profile{margin:1.25rem 0;border:1px solid var(--line);border-radius:.75rem;overflow:hidden}
  .profile div{display:grid;grid-template-columns:5rem minmax(0,1fr);gap:1rem;align-items:start;padding:.7rem .9rem}
  .profile div+div{border-top:1px solid var(--line)}
  .profile span{color:var(--muted);white-space:nowrap}
  .profile strong{text-align:left;overflow-wrap:anywhere}
  .foot{margin-top:1.5rem;font-size:.8rem;color:var(--muted)}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><a href="{{ url_for('index') }}"><span class="logo">J</span><span>Join us</span></a></div>
  <button type="button" id="theme-toggle" class="toggle" aria-label="Switch theme" title="Switch theme">
    <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</div>
<main>
{% with msgs = get_flashed_messages(with_categories=true) %}
  {% for cat, m in msgs %}<div class="msg {{ cat }}" role="{{ 'alert' if cat == 'error' else 'status' }}">{{ m }}</div>{% endfor %}
{% endwith %}
<div class="card">
{% block body %}{% endblock %}
</div>
</main>
<div class="foot">Secure sign-up &middot; HTTPS</div>
</body>
</html>
