{% extends "base.html" %}
{% block body %}
<h1>Confirm both addresses</h1>
<form method="post">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <label for="old_code">4-digit code sent to {{ old_email }}</label>
  <input id="old_code" name="old_code" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required>
  <label for="new_code">4-digit code sent to {{ new_email }}</label>
  <input id="new_code" name="new_code" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required>
  <button>Confirm</button>
</form>
<div class="stack tight"><a class="btn secondary" href="{{ url_for('index') }}">Cancel</a></div>
{% endblock %}
