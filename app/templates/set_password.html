{% extends "base.html" %}
{% block body %}
<h1>{{ 'Set your password' if purpose == 'register' else 'Choose a new password' }}</h1>
<form method="post">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <label for="password">Password (10+ characters)</label>
  <input id="password" name="password" type="password" minlength="10" autocomplete="new-password" required>
  <label for="password2">Repeat password</label>
  <input id="password2" name="password2" type="password" minlength="10" autocomplete="new-password" required>
  <button>Save password</button>
</form>
{% endblock %}
