{% extends "base.html" %}
{% block body %}
<div class="hello">
  <div class="avatar">{{ (user.name or '?')[:1]|upper }}</div>
  <h1>Welcome, {{ user.name }}</h1>
</div>
<div class="profile">
  <div><span>Name</span><strong>{{ user.name }}</strong></div>
  <div><span>E-mail</span><strong>{{ user.email }}</strong></div>
</div>
<div class="stack">
  <a class="btn secondary" href="{{ url_for('change_email') }}">Update e-mail</a>
  <form method="post" action="{{ url_for('account_password') }}">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}"><button class="secondary">Reset password</button>
  </form>
</div>
<form method="post" action="{{ url_for('logout') }}">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}"><button>Log out</button>
</form>
{% endblock %}
