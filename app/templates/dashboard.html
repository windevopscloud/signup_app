{% extends "base.html" %}
{% block body %}
<h1>Thank you for Joining {{ user.name }}, {{ user.email }}</h1>
<p>Name: <strong>{{ user.name }}</strong><br>E-mail: <strong>{{ user.email }}</strong></p>
<nav><a href="{{ url_for('change_email') }}">Update e-mail</a><a href="{{ url_for('forgot') }}">Reset password</a></nav>
<form method="post" action="{{ url_for('logout') }}">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}"><button>Log out</button>
</form>
{% endblock %}
