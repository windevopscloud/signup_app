name: build-push

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to EKS after build?"
        type: choice
        options: ["no", "yes"]
        default: "no"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"
      - "requirements.txt"

env:
  AWS_REGION: us-east-1
  ECR_REPO: signup-app
  APP_NAME: signup-app
  ENVIRONMENT: poc
  DB_PARAM: /rds/signup-poc/endpoint

jobs:
  build:
    runs-on: signup_app-runner-poc
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to ECR
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "REGISTRY=${REGISTRY}" >> "$GITHUB_ENV"
          aws ecr get-login-password --region "$AWS_REGION" | \
            docker login --username AWS --password-stdin "$REGISTRY"

      - name: Build image
        run: |
          TAG="${GITHUB_SHA::7}"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          docker build -t "${REGISTRY}/${ECR_REPO}:${TAG}" -t "${REGISTRY}/${ECR_REPO}:latest" .

      - name: Push image
        run: |
          docker push "${REGISTRY}/${ECR_REPO}:${TAG}"
          docker push "${REGISTRY}/${ECR_REPO}:latest"
          echo "Pushed ${REGISTRY}/${ECR_REPO}:${TAG}" >> "$GITHUB_STEP_SUMMARY"

      - name: Docker logout
        if: always()
        run: docker logout "$REGISTRY" || true

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'yes'
    runs-on: signup_app-runner-poc
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fill overlay tokens
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          DB_HOST=$(aws ssm get-parameter --name "$DB_PARAM" --query Parameter.Value --output text)
          TAG="${GITHUB_SHA::7}"
          F=k8s/overlays/poc/kustomization.yaml
          sed -i "s|__ACCOUNT_ID__|${ACCOUNT_ID}|g; s|__REGISTRY__|${REGISTRY}|g; s|__DB_HOST__|${DB_HOST}|g; s|__IMAGE_TAG__|${TAG}|g" "$F"
          if grep -q "__" "$F"; then echo "Unreplaced tokens"; cat "$F"; exit 1; fi
          echo "BUCKET=bundles-${ACCOUNT_ID}-${ENVIRONMENT}" >> "$GITHUB_ENV"
          echo "KEY=releases/${APP_NAME}/${TAG}-${GITHUB_RUN_NUMBER}.tgz" >> "$GITHUB_ENV"

      - name: Upload bundle
        run: |
          tar czf bundle.tgz k8s deploy
          aws s3 cp bundle.tgz "s3://${BUCKET}/${KEY}"

      - name: Run deploy on tools EC2
        run: |
          cat > params.json <<EOF
          {"commands":[
            "set -e",
            "rm -rf /tmp/bundle && mkdir -p /tmp/bundle",
            "aws s3 cp s3://${BUCKET}/${KEY} /tmp/bundle/b.tgz --region ${AWS_REGION}",
            "tar xzf /tmp/bundle/b.tgz -C /tmp/bundle",
            "cd /tmp/bundle && bash deploy/apply.sh"
          ]}
          EOF
          CMD_ID=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --targets "Key=tag:Name,Values=eks_tools-${ENVIRONMENT}" \
            --parameters file://params.json \
            --query Command.CommandId --output text)
          echo "CommandId: $CMD_ID"

          for i in $(seq 1 60); do
            STATUS=$(aws ssm list-command-invocations --command-id "$CMD_ID" \
              --query "CommandInvocations[0].Status" --output text)
            echo "Status: $STATUS"
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done

          INSTANCE_ID=$(aws ssm list-command-invocations --command-id "$CMD_ID" \
            --query "CommandInvocations[0].InstanceId" --output text)
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "[StandardOutputContent,StandardErrorContent]" --output text
          [ "$STATUS" = "Success" ]