name: runner-test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: signup_app-runner-poc
    steps:
      - name: Who am I
        run: |
          whoami
          hostname
          docker --version
          docker ps
          aws --version
          aws sts get-caller-identity
      - name: Can it reach ECR?
        run: |
          aws ecr describe-repositories --region us-east-1 --repository-names signup-app || echo "ECR access denied (expected for now)"