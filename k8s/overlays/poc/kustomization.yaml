apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: signup-config
    literals:
      - DB_HOST=__DB_HOST__
      - DB_NAME=signuprds
      - DB_SSLMODE=require
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - MAIL_FROM=windevopscloud+sender@gmail.com
      - COOKIE_SECURE=true

images:
  - name: signup-app
    newName: __REGISTRY__/signup-app
    newTag: "__IMAGE_TAG__"

patches:
  - patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: signup-app
        annotations:
          eks.amazonaws.com/role-arn: arn:aws:iam::__ACCOUNT_ID__:role/signup-app-secrets-poc-role