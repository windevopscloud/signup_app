# Which Secrets Manager secrets become files in the pod (/mnt/secrets-store/<alias>)
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: signup-secrets
  namespace: default
spec:
  provider: aws
  parameters:
    region: us-east-1
    objects: |
      - objectName: "signup/poc/rds-app"
        objectType: "secretsmanager"
        jmesPath:
          - path: username
            objectAlias: db-user
          - path: password
            objectAlias: db-password
      - objectName: "ses/poc/smtp"
        objectType: "secretsmanager"
        jmesPath:
          - path: SMTP_USER
            objectAlias: smtp-user
          - path: SMTP_PASSWORD
            objectAlias: smtp-password
      - objectName: "signup/poc/app"
        objectType: "secretsmanager"
        jmesPath:
          - path: SECRET_KEY
            objectAlias: secret-key
